name: Export Naranjal Survival Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: survival-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

      - name: Importar proyecto y assets 3D
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Godot import::La importación del proyecto terminó con código ${STATUS}."
            exit 1
          fi

      - name: Validar escena principal
        run: |
          set +e
          godot --headless --path . --quit-after 2 res://scenes/main.tscn > scene-check.log 2>&1
          STATUS=$?
          set -e
          cat scene-check.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" scene-check.log; then
            DETAIL="$(grep -Ei "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|Failed to load script" scene-check.log | head -n 14 | tr '\n' ' ' || true)"
            if [ -z "$DETAIL" ]; then
              DETAIL="La escena principal no supera la validación (código ${STATUS})."
            fi
            echo "::error title=Godot scene check::${DETAIL}"
            exit 1
          fi

      - name: Exportar Web
        run: |
          rm -rf web
          mkdir -p web
          set +e
          godot --headless --path . --export-release "Web" web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log

          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" export.log; then
            PARSE_DETAIL="$(grep -Ei "SCRIPT ERROR:|Parse Error:|Compile Error:" export.log | head -n 14 | tr '\n' ' ' || true)"
            if [ -n "$PARSE_DETAIL" ]; then
              echo "::error title=Godot compile detail::${PARSE_DETAIL}"
            fi
            ERROR_LINE="$(grep -Ei "ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Failed|Cannot|Could not" export.log | tail -n 1 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Godot terminó la exportación Web con código ${STATUS}; revisar export.log."
            fi
            echo "::error title=Godot Web export::${ERROR_LINE}"
            exit 1
          fi

          for OUTPUT_FILE in web/index.html web/index.wasm web/index.pck; do
            if [ ! -s "$OUTPUT_FILE" ]; then
              echo "::error title=Godot Web export::Falta el artefacto esperado ${OUTPUT_FILE} tras una exportación con código 0."
              exit 1
            fi
          done

          touch web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Publicar juego
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
