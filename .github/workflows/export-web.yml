name: Export Naranjal Survival Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: survival-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  WILDLIFE_SOURCE_COMMIT: "9b5a2827ed8f2b7adf657ddf7e47cb026bab0b39"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sincronizar fauna Quaternius CC0
        run: |
          set -eu
          TARGET="assets/third_party/quaternius/wildlife"
          mkdir -p "$TARGET"

          if [ -s "$TARGET/deer.glb" ] && [ -s "$TARGET/boar.glb" ] && [ -s "$TARGET/boar_Atlas.png" ]; then
            echo "Fauna Quaternius ya versionada; no es necesario sincronizar."
            exit 0
          fi

          SOURCE_DIR="$(mktemp -d)"
          git init -q "$SOURCE_DIR"
          git -C "$SOURCE_DIR" remote add origin https://github.com/StateDev08/War-of-the-Kindom-Mobile.git
          git -C "$SOURCE_DIR" config core.sparseCheckout true
          mkdir -p "$SOURCE_DIR/.git/info"
          printf '%s\n' 'client/assets/models/quaternius/animals/' > "$SOURCE_DIR/.git/info/sparse-checkout"
          git -C "$SOURCE_DIR" fetch --depth 1 --filter=blob:none origin "$WILDLIFE_SOURCE_COMMIT"
          git -C "$SOURCE_DIR" checkout -q --detach FETCH_HEAD

          SOURCE_PATH="$SOURCE_DIR/client/assets/models/quaternius/animals"
          test "$(git -C "$SOURCE_DIR" rev-parse "$WILDLIFE_SOURCE_COMMIT:client/assets/models/quaternius/animals/deer.glb")" = "08d273334d1e1f4f21f9905251ea82a6d8bae1fe"
          test "$(git -C "$SOURCE_DIR" rev-parse "$WILDLIFE_SOURCE_COMMIT:client/assets/models/quaternius/animals/boar.glb")" = "5f97beed14eb0db209c89b5423a1609d61cf662a"
          test "$(git -C "$SOURCE_DIR" rev-parse "$WILDLIFE_SOURCE_COMMIT:client/assets/models/quaternius/animals/boar_Atlas.png")" = "1ba36d43584728349c9785c62020e226fb602590"

          cp "$SOURCE_PATH/deer.glb" "$TARGET/deer.glb"
          cp "$SOURCE_PATH/boar.glb" "$TARGET/boar.glb"
          cp "$SOURCE_PATH/boar_Atlas.png" "$TARGET/boar_Atlas.png"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET/deer.glb" "$TARGET/boar.glb" "$TARGET/boar_Atlas.png"
          if ! git diff --cached --quiet; then
            git commit -m "Integra fauna Quaternius CC0"
            git push origin HEAD:main
          fi

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

      - name: Importar proyecto y assets 3D
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Godot import::La importación del proyecto terminó con código ${STATUS}."
            exit 1
          fi

      - name: Validar escena principal
        run: |
          set +e
          godot --headless --path . --quit-after 2 res://scenes/main.tscn > scene-check.log 2>&1
          STATUS=$?
          set -e
          cat scene-check.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" scene-check.log; then
            DETAIL="$(grep -Ei "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|Failed to load script" scene-check.log | head -n 14 | tr '\n' ' ' || true)"
            if [ -z "$DETAIL" ]; then
              DETAIL="La escena principal no supera la validación (código ${STATUS})."
            fi
            echo "::error title=Godot scene check::${DETAIL}"
            exit 1
          fi

      - name: Exportar Web
        run: |
          rm -rf web
          mkdir -p web
          set +e
          godot --headless --path . --export-release "Web" web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log

          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" export.log; then
            PARSE_DETAIL="$(grep -Ei "SCRIPT ERROR:|Parse Error:|Compile Error:" export.log | head -n 14 | tr '\n' ' ' || true)"
            if [ -n "$PARSE_DETAIL" ]; then
              echo "::error title=Godot compile detail::${PARSE_DETAIL}"
            fi
            ERROR_LINE="$(grep -Ei "ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Failed|Cannot|Could not" export.log | tail -n 1 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Godot terminó la exportación Web con código ${STATUS}; revisar export.log."
            fi
            echo "::error title=Godot Web export::${ERROR_LINE}"
            exit 1
          fi

          for OUTPUT_FILE in web/index.html web/index.wasm web/index.pck; do
            if [ ! -s "$OUTPUT_FILE" ]; then
              echo "::error title=Godot Web export::Falta el artefacto esperado ${OUTPUT_FILE} tras una exportación con código 0."
              exit 1
            fi
          done

          touch web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Publicar juego
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
